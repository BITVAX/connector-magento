target-version = "py310"
fix = true

[lint]
extend-select = [
    "I",
]
ignore = [
    "E741",  # ambiguous variable name (common in Odoo lambdas)
    "E402",  # module level import not at top of file (Odoo patterns)
    "F811",  # redefinition of unused name (common with _ import)
]
exclude = ["setup/*"]

[format]
exclude = ["setup/*"]

[lint.per-file-ignores]
"__init__.py" = ["F401", "I001"]
"__manifest__.py" = ["B018"]

[lint.isort]
section-order = ["future", "standard-library", "third-party", "odoo", "odoo-addons", "first-party", "local-folder"]

[lint.isort.sections]
"odoo" = ["odoo"]
"odoo-addons" = ["odoo.addons"]
